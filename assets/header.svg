<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#141B34"/>
      <stop offset="1" stop-color="#1E1446"/>
    </linearGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6C63FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
    <clipPath id="card"><rect width="1200" height="300" rx="22"/></clipPath>
    <style>
      .node{fill:#0E1428;stroke:#334155;stroke-width:1.2}
      .lbl{fill:#94A3B8;font-size:12px;font-weight:600;letter-spacing:.5px}
      .wire{stroke:#334155;stroke-width:1.4;fill:none;stroke-dasharray:4 5}
      .pill{fill:#ffffff;fill-opacity:.06;stroke:#ffffff;stroke-opacity:.12}
      .ptxt{fill:#E2E8F0;font-size:15px;font-weight:600}
      .fade{animation:in .9s ease-out backwards}
      .d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}.d4{animation-delay:.75s}
      @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle cx="980" cy="150" r="260" fill="url(#glow)"/>

    <!-- left: identity -->
    <g class="fade">
      <text x="64" y="82" fill="#64748B" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="15">~/bhupinder $ whoami<tspan class="blink" fill="#7DD3FC"> ▍</tspan></text>
    </g>
    <text class="fade d1" x="62" y="146" font-size="58" font-weight="800" fill="url(#name)" letter-spacing="-1">Bhupinder Singh</text>
    <text class="fade d2" x="64" y="184" font-size="21" font-weight="500" fill="#CBD5E1">Backend Developer · Node.js · NestJS · Microservices</text>

    <g class="fade d3">
      <rect class="pill" x="64" y="214" width="158" height="38" rx="19"/>
      <text class="ptxt" x="143" y="238" text-anchor="middle">3 yrs experience</text>
      <rect class="pill" x="234" y="214" width="196" height="38" rx="19"/>
      <text class="ptxt" x="332" y="238" text-anchor="middle">Kafka · gRPC · Redis</text>
      <rect x="442" y="214" width="214" height="38" rx="19" fill="#22C55E" fill-opacity=".12" stroke="#22C55E" stroke-opacity=".55"/>
      <circle class="pulse" cx="464" cy="233" r="5" fill="#22C55E"/>
      <text x="566" y="238" text-anchor="middle" fill="#86EFAC" font-size="15" font-weight="700">Open to work · now</text>
    </g>

    <!-- right: live event bus -->
    <g class="fade d4">
      <path id="w1" class="wire" d="M770 92 C 850 92, 850 150, 930 150"/>
      <path id="w2" class="wire" d="M770 150 L 930 150"/>
      <path id="w3" class="wire" d="M770 208 C 850 208, 850 150, 930 150"/>
      <path id="w4" class="wire" d="M1030 150 C 1080 150, 1080 92, 1120 92"/>
      <path id="w5" class="wire" d="M1030 150 C 1080 150, 1080 208, 1120 208"/>

      <rect class="node" x="690" y="74" width="80" height="36" rx="9"/><text class="lbl" x="730" y="97" text-anchor="middle">API</text>
      <rect class="node" x="690" y="132" width="80" height="36" rx="9"/><text class="lbl" x="730" y="155" text-anchor="middle">gRPC</text>
      <rect class="node" x="690" y="190" width="80" height="36" rx="9"/><text class="lbl" x="730" y="213" text-anchor="middle">Webhook</text>

      <rect x="930" y="122" width="100" height="56" rx="12" fill="#1E1B4B" stroke="#A78BFA" stroke-opacity=".8"/>
      <text x="980" y="146" text-anchor="middle" fill="#E9D5FF" font-size="14" font-weight="800">Kafka</text>
      <text x="980" y="164" text-anchor="middle" fill="#A78BFA" font-size="11">idempotent</text>

      <rect class="node" x="1120" y="74" width="62" height="36" rx="9"/><text class="lbl" x="1151" y="97" text-anchor="middle">Pay</text>
      <rect class="node" x="1120" y="190" width="62" height="36" rx="9"/><text class="lbl" x="1151" y="213" text-anchor="middle">Notify</text>

      <g filter="url(#soft)">
        <circle r="4" fill="#7DD3FC"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle>
        <circle r="4" fill="#A78BFA"><animateMotion dur="2.1s" begin=".6s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle>
        <circle r="4" fill="#F472B6"><animateMotion dur="2.9s" begin="1.1s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle>
        <circle r="4" fill="#86EFAC"><animateMotion dur="1.8s" begin=".3s" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle>
        <circle r="4" fill="#FCD34D"><animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite"><mpath href="#w5"/></animateMotion></circle>
      </g>
      <circle r="2.2" fill="#fff"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle>
      <circle r="2.2" fill="#fff"><animateMotion dur="2.1s" begin=".6s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle>
      <circle r="2.2" fill="#fff"><animateMotion dur="2.9s" begin="1.1s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle>
      <circle r="2.2" fill="#fff"><animateMotion dur="1.8s" begin=".3s" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle>
      <circle r="2.2" fill="#fff"><animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite"><mpath href="#w5"/></animateMotion></circle>
    </g>
  </g>
</svg>
